[workspace]
resolver = "2"
members = ["h3-sys", "h3-core", "h3-http", "h3d", "sycl-h3"]

# The release version is not kept here: it is yy.mmdd.### from git (version.sh), which build.sh hands to cargo as
# H3_VERSION and `sycl-h3 version` prints.
[workspace.package]
version = "0.0.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
