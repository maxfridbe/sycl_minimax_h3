# Build everything in the project's own container, test it, and publish.
#
#   every push (any branch) and pull request   build image -> ./build.sh -> ./build.sh test -> tarball artifact
#   pushes to the default branch  also publish the build image to the GitHub container registry, and a GitHub
#                                 release v<version> with the tarball
#
# The version is yy.mmdd.### from git (./version.sh): the commit's date, then its number among that day's commits.
#
# No GPU is needed: the SYCL kernels are compiled ahead of use and the Rust tests run on the CPU. What needs the card
# (check-linear, check-block, bench-blocks) is run by hand on a machine that has one.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release
  packages: write   # the build image

env:
  H3_CONTAINER_ENGINE: podman

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.sh counts the day's commits

      - name: Version
        run: |
          echo "H3_VERSION=$(./version.sh)" >> "$GITHUB_ENV"
          ./version.sh

      - name: Free disk space (the build image is about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The image depends only on container/Containerfile, so it is published under that file's hash and reused
      # until the file changes.
      - name: Build image, or pull the one already published for this Containerfile
        run: |
          tag=$(sha256sum container/Containerfile | cut -c1-12)
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/h3-build"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if podman pull "$ref:$tag"; then
            podman tag "$ref:$tag" h3-build
          else
            ./setup.sh
          fi

      - name: Build (SYCL kernels, Rust engine, web front end)
        run: ./build.sh

      - name: Test (Rust tests and lints)
        run: ./build.sh test

      - name: Package
        run: |
          name="h3-engine-$H3_VERSION-linux-x86_64"
          mkdir -p "pkg/$name"
          cp -r dist/sycl-h3 dist/h3d dist/libh3sycl.so dist/libh3sage.so dist/libdnnl.so.3 dist/wfe kernels/h3sycl.h README.md "pkg/$name/"
          echo "$H3_VERSION" > "pkg/$name/VERSION"
          tar -C pkg -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PKG=$name.tar.gz" >> "$GITHUB_ENV"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: h3-engine
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256

      - name: Publish the build image
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          podman tag h3-build "$IMAGE_REF:$IMAGE_TAG"
          podman push "$IMAGE_REF:$IMAGE_TAG"
          podman tag h3-build "$IMAGE_REF:latest"
          podman push "$IMAGE_REF:latest"

      - name: Publish the release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # every push to the default branch is a release, tagged v<version> on the commit built
          if gh release view "v$H3_VERSION" >/dev/null 2>&1; then echo "v$H3_VERSION is out already"; exit 0; fi
          gh release create "v$H3_VERSION" "$PKG" "$PKG.sha256" --target "$GITHUB_SHA" --title "$H3_VERSION" --generate-notes
