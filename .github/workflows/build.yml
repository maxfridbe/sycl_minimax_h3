# Build everything in the project's own container, test it, and publish.
#
#   every push and pull request   build image -> ./build.sh -> ./build.sh test -> the dist/ tarball as a workflow artifact
#   pushes to main                also publish the build image to the GitHub container registry
#   tags v<VERSION>               also publish a GitHub release with the tarball (e.g. v26.1002.001)
#
# No GPU is needed: the SYCL kernels are compiled ahead of use and the Rust tests run on the CPU. What needs the card
# (check-linear, check-block, bench-blocks) is run by hand on a machine that has one.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release
  packages: write   # the build image

env:
  H3_CONTAINER_ENGINE: podman

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build image is about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The image depends only on container/Containerfile, so it is published under that file's hash and reused
      # until the file changes.
      - name: Build image, or pull the one already published for this Containerfile
        run: |
          tag=$(sha256sum container/Containerfile | cut -c1-12)
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/h3-build"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if podman pull "$ref:$tag"; then
            podman tag "$ref:$tag" h3-build
          else
            ./setup.sh
          fi

      - name: Build (SYCL kernels, Rust engine, web front end)
        run: ./build.sh

      - name: Test (Rust tests and lints)
        run: ./build.sh test

      - name: Package
        run: |
          name="h3-engine-$(cat VERSION)-linux-x86_64"
          mkdir -p "pkg/$name"
          cp -r dist/h3 dist/libh3sycl.so dist/libdnnl.so.3 dist/wfe kernels/h3sycl.h README.md VERSION "pkg/$name/"
          tar -C pkg -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PKG=$name.tar.gz" >> "$GITHUB_ENV"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: h3-engine
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256

      - name: Publish the build image
        if: github.event_name != 'pull_request'
        run: |
          podman tag h3-build "$IMAGE_REF:$IMAGE_TAG"
          podman push "$IMAGE_REF:$IMAGE_TAG"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            podman tag h3-build "$IMAGE_REF:latest"
            podman push "$IMAGE_REF:latest"
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a release is cut by tagging v<VERSION>; the tag and the VERSION file must agree
          [ "$GITHUB_REF_NAME" = "v$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME is not v$(cat VERSION)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$PKG" "$PKG.sha256" --title "$(cat VERSION)" --generate-notes
